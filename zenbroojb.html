<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENBROO GAMES</title>
    <style>
                /* 1. LAYOUT UTAMA LANSKAP (MEMENUHI LAYAR TV) */
        html, body {
            margin: 0;
            padding: 0;
            background: #070512;
            color: #e6ebf2;
            font-family: 'Segoe UI', system-ui, sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Membagi atas, tengah, bawah agar luas */
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Gambar Latar Belakang Kustom - Dipaksa Melebar Penuh (Lanskap) */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(7, 5, 18, 0.4), rgba(7, 5, 18, 0.7)), 
                        radial-gradient(circle at center, rgba(0, 238, 255, 0.2) 0%, rgba(255, 0, 170, 0.08) 80%);
            background-size: cover;
            background-position: center;
            z-index: 1;
            width: 100%;
            height: 100%;
        }

        /* 2. STRIP BANNER ATAS LANSKAP (MELEBAR DARI UJUNG KE UJUNG) */
        .top-bar-title {
            position: relative;
            width: 100%;
            background: rgba(11, 9, 26, 0.9);
            border-bottom: 3px solid #00eeff;
            text-align: center;
            padding: 15px 0;
            font-size: 32px; /* Diperbesar agar jelas di TV */
            font-weight: 900;
            letter-spacing: 0.4em;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 15px #00eeff, 0 0 30px rgba(0, 238, 255, 0.5);
            z-index: 20;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        /* 3. KONTANER LOGO DI TENGAH (FOKUS UTAMA LANSKAP) */
        #brand {
            position: relative;
            text-align: center;
            z-index: 10;
            margin-top: auto;   /* Menjaga posisi seimbang di tengah vertikal */
            margin-bottom: auto;
        }

        /* Pembungkus Lingkaran Loading */
        .logo-wrapper {
            position: relative;
            width: 260px; /* Diperbesar agar proporsional dengan layar lanskap TV */
            height: 260px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Logo Bulat Zenbroo di Tengah Cincin */
        .logo-wrapper img {
            width: 200px;   
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            z-index: 3;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            filter: drop-shadow(0 0 10px rgba(255, 0, 170, 0.3));
        }

        /* Cincin Putaran Loading Neon */
        .logo-wrapper::before {
            content: "";
            position: absolute;
            width: 230px;   
            height: 230px;
            border-radius: 50%;
            border: 5px solid rgba(0, 238, 255, 0.05);
            border-top: 5px solid #00eeff;            
            border-right: 5px solid #ff00aa;          
            z-index: 2;
            animation: spin-loading 1.6s linear infinite;
            filter: drop-shadow(0 0 12px #00eeff) drop-shadow(0 0 5px #ff00aa);
        }

        /* Teks Zenbroo Games Di Bawah Logo */
        #brand b {
            font-size: 34px; /* Diperbesar untuk layar TV */
            font-weight: 900;
            letter-spacing: .25em;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 0, 170, 0.8), 0 2px 8px rgba(0,0,0,0.9);
            display: block;
            text-transform: uppercase;
            margin-top: 15px;
        }

        /* 4. AREA STATUS DI BAGIAN PALING BAWAH (FOOTER STYLE) */
        #wrap {
            position: relative;
            width: 100%;
            padding: 20px 0;
            background: rgba(7, 5, 18, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            z-index: 10;
        }
        #state {
            font-size: 18px;
            font-weight: 700;
            color: #00eeff;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: rgba(0, 238, 255, 0.12);
            padding: 8px 24px;
            border-radius: 25px;
            border: 1px solid rgba(0, 238, 255, 0.3);
            display: inline-block;
            box-shadow: 0 0 15px rgba(0, 238, 255, 0.2);
        }
        #det, #cache {
            font-size: 14px;
            color: #a0aec0;
            margin-top: 6px;
            font-weight: 500;
        }

        /* ANIMASI PUTARAN CINCIN */
        @keyframes spin-loading {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
