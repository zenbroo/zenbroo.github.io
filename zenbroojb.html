<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ZENBROO GAMES</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        /* Gradasi warna latar belakang ungu gelap sesuai konsep gambar Anda */
        background: radial-gradient(circle, #270d57 0%, #0a0409 100%);
        color: #c8ced8;
        font: 25px/1.45 "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }

      /* --- EDIT CSS LANGKAH 1 & 2 UNTUK MEMINDAHKAN LOGO HTML KE TENGAH --- */

      /* Mengatur header brand atas agar tetap rapi tanpa merusak teksnya */
      #brand {
        text-align: center;
        padding: 20px 20px;
        background: rgba(11, 13, 16, 0.5);
        border-bottom: 3px solid #00f3ff;
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
      }

      #brand b {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 0.3em;
        color: #ffffff;
        text-shadow: 0 0 8px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.5);
        text-transform: uppercase;
      }

      /* KUNCI UTAMA: Memaksa tag img dari atas agar turun ke tengah layar secara presisi */
      #brand img {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 160px;  /* Mengatur ukuran logo di tengah */
        height: 160px; /* Mengatur ukuran logo di tengah */
        border-radius: 50%; /* Membuat logo melingkar sempurna */
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.8); /* Efek glow ungu pada logo */
        z-index: 1;
      }

      /* Elemen #wrap dikosongkan karena logo sudah ditarik langsung dari tag img HTML */
      #wrap {
        display: none; 
      }

      #spin {
        position: fixed;
        top: 50%; /* Diubah ke 50% agar sejajar sempurna secara vertikal dengan koordinat logo */
        left: 50%;
        width: 176px;
        height: 176px;
        margin: -92px 0 0 -92px; 
        border-radius: 50%;
        z-index: 2;

        /* EFEK PREMIUM: Membuat garis melingkar pudar (glow trail) menggunakan gradasi konik */
        background: conic-gradient(from 0deg, transparent 30%, #00f3ff 70%, #ff007f 100%);
        
        /* Membuat bagian tengah lingkaran menjadi berlubang transparan agar logo di belakangnya terlihat */
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #fff calc(100% - 4px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #fff calc(100% - 4px));

        /* Efek cahaya neon yang sangat kuat di luar lingkaran loading */
        box-shadow: 0 0 25px rgba(0, 243, 255, 0.6), inset 0 0 15px rgba(255, 0, 127, 0.4);
        
        /* Menjalankan dua animasi sekaligus: Berputar super mulus DAN berdenyut lembut */
        animation: 
          spinPremium 1.4s linear infinite,
          pulseRing 2s ease-in-out infinite;
      }

      /* ANIMASI 1: Putaran konstan yang sangat halus tanpa patah-patah */
      @keyframes spinPremium {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* ANIMASI 2: Efek cincin membesar dan mengecil tipis seperti detak jantung agar terkesan futuristik */
      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.03); opacity: 1; box-shadow: 0 0 35px rgba(0, 243, 255, 0.8); }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        /* Ditempatkan di bawah logo dengan jarak yang pas */
        top: calc(50% + 140px);
        left: 0;
        right: 0;
        transform: none;
        text-align: center;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        z-index: 3;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      /* KONDISI 1: SAAT PROSES MASIH BERJALAN DI LATAR BELAKANG */
      /* Memaksa elemen #msg agar muncul dari awal proses */
      body:not(.done):not(.fail):not(.log) #msg {
        display: block;
        color: transparent; /* Menyembunyikan teks asli "Restart your console" */
      }
      /* Menyuntikkan teks kustom Anda dengan efek neon putih berdenyut */
      body:not(.done):not(.fail):not(.log) #msg::after {
        content: "WAIT ZENBROO MENGAKTIFKAN HEN PS4";
        display: block;
        color: #8df8fe;
        text-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
        animation: pulseText 1.5s infinite ease-in-out;
      }

      /* KONDISI 2: SAAT BERHASIL (DONE) */
      body.done #spin {
        display: none;
      }
      body.done #msg {
        display: block;
        color: #ffbbbb; /* Teks otomatis berganti ke pesan asli sistem (Hijau Cyan Neon) */
        text-shadow: 0 0 12px rgba(255, 51, 102, 0.8), 0 0 25px rgba(0, 255, 204, 0.4);
      }
      /* Menghapus teks "ZENBROO MENGAKTIFKAN..." saat done */
      body.done #msg::after {
        content: none;
      }

      /* KONDISI 3: SAAT GAGAL / REFRESH (FAIL) */
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
        color: #ffdddd; /* Teks otomatis berganti ke pesan asli sistem (Merah Magenta Neon) */
        text-shadow: 0 0 12px rgba(255, 51, 102, 0.8), 0 0 25px rgba(255, 51, 102, 0.4);
      }
      /* Menghapus teks "ZENBROO MENGAKTIFKAN..." saat fail */
      body.fail #msg::after {
        content: none;
      }

      /* KONDISI 4: ?log=1 -- MODE LOG TEKS PENUH */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        color: #00f3ff;
        margin: 20px 0;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 13px/1.5 "Consolas", monospace;
        background: rgba(16, 11, 25, 0.8);
        border: 1px solid #ff007f;
        box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
        border-radius: 8px;
        padding: 15px;
        height: calc(100vh - 160px);
        overflow-y: auto;
        color: #9fb3d0;
      }

      /* Warna teks log bawaan jb.js */
      .ok { color: #7fd0a0; }
      .bad { color: #d08a7f; }
      .warn { color: #d8c07f; }
      .safe { color: #7fd0a0; }
      .danger { color: #d08a7f; }
      code { color: #9fb3d0; }

      /* Animasi teks halus saat proses loading awal */
      @keyframes pulseText {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

    </style>
  </head>
