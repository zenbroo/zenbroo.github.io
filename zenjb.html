<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ZENBROO GAMES</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: radial-gradient(circle, #270d57 0%, #0a0409 100%);
        color: #c8ced8;
        font: 25px/1.45 "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      #brand {
        text-align: center;
        padding: 20px 20px;
        background: rgba(11, 13, 16, 0.5);
        border-bottom: 3px solid #00f3ff;
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
      }
      #brand b {
        font-size: 100px;
        font-weight: 800;
        letter-spacing: 0.3em;
        color: #ffffff;
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.8), 0 0 30px rgba(0, 242, 255, 0.768);
        text-transform: uppercase;
      }
      #brand img {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 160px;
        height: 160px;
        border-radius: 50%;
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
        z-index: 1;
      }
      #wrap {
        display: none; 
      }
      #spin {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 176px;
        height: 176px;
        margin: -92px 0 0 -92px; 
        border-radius: 50%;
        z-index: 2;
        border: 4px solid rgba(0, 243, 255, 0.05);
        border-top-color: #ff007f;
        border-right-color: #00f3ff;
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.4), inset 0 0 10px rgba(255, 0, 127, 0.2);
        animation: spinPS4 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes spinPS4 {
        0% { 
          transform: rotate(0deg); 
        }
        50% {
          box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
        }
        100% { 
          transform: rotate(360deg); 
        }
      }
      #msg {
        display: block !important; 
        position: fixed;
        top: calc(50% + 130px); 
        left: 0;
        right: 0;
        transform: none;
        text-align: center;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        z-index: 3;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }
      body:not(.done):not(.fail):not(.log) #msg {
        font-size: 0 !important;
        animation: pulseTextPS4 1.5s ease-in-out infinite;
      }
      body:not(.done):not(.fail):not(.log) #msg::after {
        content: "ZENBROO MENGAKTIFKAN HEN PS4";
        display: block;
        font-size: 19px;
        color: #ffffff;
        text-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
      }
      body.done #spin {
        display: none;
      }
      body.done #msg {
        font-size: 19px !important;
        color: #d6fcfe;
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
        animation: none;
      }
      body.done #msg::after {
        content: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        font-size: 19px !important;
        color: hsl(345, 100%, 92%);
        text-shadow: 0 0 10px rgba(255, 51, 102, 0.6);
        animation: none;
      }
      body.fail #msg::after {
        content: none;
      }
      @keyframes pulseTextPS4 {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        color: #00f3ff;
        margin: 20px 0;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 13px/1.5 "Consolas", monospace;
        background: rgba(16, 11, 25, 0.8);
        border: 1px solid #ff007f;
        box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
        border-radius: 8px;
        padding: 15px;
        height: calc(100vh - 160px);
        overflow-y: auto;
        color: #9fb3d0;
      }
      .ok { color: #7fd0a0; }
      .bad { color: #d08a7f; }
      .warn { color: #d8c07f; }
      .safe { color: #7fd0a0; }
      .danger { color: #d08a7f; }
      code { color: #9fb3d0; }
      @keyframes pulseText {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
  </head>
